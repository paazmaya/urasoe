name: Cross-Platform Build

# Ensures the project builds on multiple platforms (Windows, macOS, Linux)
# - Builds on all platforms for every push and PR
# - Creates GitHub releases with binaries when a version tag is pushed

on:
  push:
    branches: [ main ]
    tags: ['v*']
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build:
    # Build the project on multiple operating systems
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: matrix.os == 'ubuntu-latest' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: urasoe
            asset_name: urasoe-linux-amd64
          - os: windows-latest
            artifact_name: urasoe.exe
            asset_name: urasoe-windows-amd64.exe
          - os: macos-latest
            artifact_name: urasoe
            asset_name: urasoe-macos-amd64
    
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install stable toolchain
        uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable
      
      - name: Cache dependencies
        uses: chainguard-actions/actions-cache@46c2783c2418d3de33490be27a0d86c6268bc4fd # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Upload build artifact
        uses: chainguard-actions/actions-upload-artifact@c91615377dcc230c6b156542d25044f9b8d80dd8 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  # Create GitHub release with assets when a tag is pushed
  # To use: git tag v1.0.0 && git push --tags
  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Build
        uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: urasoe-linux-amd64
          path: ./
      
      - name: Download Windows Build
        uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: urasoe-windows-amd64.exe
          path: ./
      
      - name: Download macOS Build
        uses: chainguard-actions/actions-download-artifact@d0056a87e7a5e15c79b2dc00f9a66d1aaf86907d # v8.0.2
        with:
          name: urasoe-macos-amd64
          path: ./
      
      - name: Create Release and Upload Assets
        uses: chainguard-actions/softprops-action-gh-release@fa3520b7baa59eb7412eccc0538a968e4aec8f75 # v3.0.4
        with:
          files: |
            ./urasoe-linux-amd64
            ./urasoe-windows-amd64.exe
            ./urasoe-macos-amd64
