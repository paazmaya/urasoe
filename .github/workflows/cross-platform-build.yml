name: Cross-Platform Build

# Ensures the project builds on multiple platforms (Windows, macOS, Linux)
# - Builds on all platforms for every push and PR
# - Creates GitHub releases with binaries when a version tag is pushed

on:
  push:
    branches: [ main ]
    tags: ['v*']
    paths-ignore:
      - "**.md"
      - "LICENSE*"
  pull_request:
    branches: [ main ]
    paths-ignore:
      - "**.md"
      - "LICENSE*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  build:
    # Build the project on multiple operating systems
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: matrix.os == 'ubuntu-latest' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: urasoe
            asset_name: urasoe-linux-amd64
          - os: windows-latest
            artifact_name: urasoe.exe
            asset_name: urasoe-windows-amd64.exe
          - os: macos-latest
            artifact_name: urasoe
            asset_name: urasoe-macos-amd64
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      
      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release binary
        run: cargo build --release
      
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.artifact_name }}

  # Create GitHub release with assets when a tag is pushed
  # To use: git tag v1.0.0 && git push --tags
  release:
    name: Create Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: urasoe-linux-amd64
          path: ./
      
      - name: Download Windows Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: urasoe-windows-amd64.exe
          path: ./
      
      - name: Download macOS Build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: urasoe-macos-amd64
          path: ./
      
      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ./urasoe-linux-amd64
            ./urasoe-windows-amd64.exe
            ./urasoe-macos-amd64
