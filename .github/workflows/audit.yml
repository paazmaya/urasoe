name: Security Audit

# Checks for security vulnerabilities in dependencies
# - Runs on a weekly schedule (Sunday at midnight)
# - Runs when Cargo.toml or Cargo.lock files are modified
# - Uses cargo-audit to identify known vulnerabilities

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly at midnight on Sunday
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: chainguard-actions/actions-checkout@37298d8de412b35988dd165ffae45f45b329d365 # v7.0.1
        with:
          persist-credentials: false
      
      - name: Install stable toolchain
        uses: chainguard-actions/dtolnay-rust-toolchain@7b7b95556805186e9eb5b44efdafea3a47dbaa56 # v1
        with:
          toolchain: stable

      - name: Install cargo binary installer
        uses: cargo-bins/cargo-binstall@5885714d0a40a14b2535c6ffc051fd8e49aa9665 # v1.27.0

      - name: Install cargo-audit
        run: cargo binstall --no-confirm cargo-audit
      
      - name: Run cargo-audit
        run: cargo audit --deny warnings
