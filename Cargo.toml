[package]
name = "urasoe"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Juga Paazmaya <paazmaya@yahoo.com>"]
homepage = "https://github.com/paazmaya/urasoe"
repository = "https://github.com/paazmaya/urasoe"
description = "Generate images with ControlNet by reading images from a folder and calling Stable Diffusion API"
keywords = ["stable-diffusion", "controlnet", "image-generation", "cli"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["src/**/*", "Cargo.toml", "LICENSE", "README.md"]

[dependencies]
clap = { version = "4.5.39", features = ["derive"] }
tokio = { version = "1.45.1", features = ["full"] }
reqwest = { version = "0.12.19", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
base64 = "0.23.0"
anyhow = "1.0.98"
colored = "3.0.0"
image = "0.25.6"
chrono = "0.4.41"
tempfile = "3.20.0"

[dev-dependencies]
nix = { version = "0.30.1", features = ["user"] }
mockito = "1.7.0"
wiremock = "0.6.3"
